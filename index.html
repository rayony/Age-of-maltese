<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#2a2218" />
  <title>Age of Maltese 心心狗屋</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <strong>Age of Maltese</strong>
        <span>Mallow vs Toast</span>
      </div>
      <div id="status" class="status">蛋糕 0 · 人口 1/10</div>
    </header>
    <div class="stage">
      <canvas id="game" width="1600" height="900"></canvas>
      <div class="float-hud">
        <div class="chip left">Toast</div>
        <div class="timer">
          <strong id="clock">05:00</strong>
          <em id="clockLabel">Countdown</em>
        </div>
        <div class="chip right">Mallow</div>
      </div>
      <aside id="inspect" class="inspect hidden">
        <canvas id="portrait" width="160" height="120"></canvas>
        <h3 id="insName">—</h3>
        <div class="stat">
          <span>HP</span>
          <b id="insHpNum">0 / 0</b>
        </div>
        <div class="bar"><i id="insHpFill"></i></div>
        <div class="stat"><span>Attack</span><b id="insAtk">—</b></div>
        <div class="stat"><span>Status</span><b id="insSt">idle</b></div>
        <div id="inspectActs" class="acts"></div>
      </aside>
      <div id="fever" class="fever hidden">
        <strong>FEVER</strong>
        <span>Both houses −40 every 15s</span>
      </div>
    </div>
    <div id="hud" class="hud">
      <button data-act="worker">工狗 40</button>
      <button data-act="playground">遊樂場 80</button>
      <button data-act="fighter">鬥狗 55</button>
      <button data-act="workshop">工坊 100</button>
      <button data-act="car">狗車 70</button>
      <button data-act="pauseBuild">全停</button>
      <button data-act="cutBuild">下一座先蓋</button>
      <button data-act="stop">停止</button>
    </div>
  </div>
  <div id="title" class="overlay">
    <div class="card">
      <h1>Age of Maltese</h1>
      <p>原創隊伍 <b>Mallow</b>（白毛）對 <b>Toast</b>（金毛）。<br/>線條小狗風，但角色是本遊戲自己的。</p>
      <div class="row">
        <button id="easy">vs AI 簡單</button>
        <button id="hard">vs AI 困難</button>
      </div>
      <p class="fine">點一下開音樂 · 人口 10 · 5 分鐘後 Fever</p>
    </div>
  </div>
  <div id="end" class="overlay hidden">
    <div class="card">
      <h2 id="endTitle">勝利</h2>
      <p id="endMsg"></p>
      <button id="again">再來一局</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
